name: Build TG-WA Floating Share APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Gradle and Manifest Files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/bridge/telewa
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TeleWaFloatingBridge"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.bridge.telewa"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.bridge.telewa"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeViewClicked|typeViewSelected|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:packageNames="ir.ilmili.telegraph,com.whatsapp" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared_posts" path="shared_posts/" />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="ir.ilmili.telegraph" />
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="TG-WA Share Bridge"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".ShareBridgeActivity"
                      android:exported="true"
                      android:label="TG-WA Bridge (With Caption)"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="video/*" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingShareService" android:exported="false" />
                  <service
                      android:name=".PostBridgeAccessibilityService"
                      android:exported="false"
                      android:label="TG-WA Caption Helper"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.bridge.telewa.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: Create Kotlin App Source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "TeleWaFloatingBridge.kt" ]]; then
              cp "TeleWaFloatingBridge.kt" app/src/main/java/com/bridge/telewa/TeleWaFloatingBridge.kt
          else
              cat << 'KOTLIN_EOF' > app/src/main/java/com/bridge/telewa/TeleWaFloatingBridge.kt
          package com.bridge.telewa

          import android.accessibilityservice.AccessibilityService
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.*
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.*
          import androidx.core.content.FileProvider
          import java.io.File
          import java.io.FileOutputStream
          import kotlin.math.abs

          object BridgeState {
              const val PKG_GRAPH = "ir.ilmili.telegraph"
              const val PKG_WA = "com.whatsapp"
              @Volatile var activePkg: String = PKG_GRAPH
              @Volatile var lastCaption: String = ""
              @Volatile var lastTime: Long = 0L

              fun recordCaption(t: String) {
                  val c = t.trim()
                  if (c.isNotEmpty()) { lastCaption = c; lastTime = System.currentTimeMillis() }
              }
              fun getFreshCaption(): String? =
                  if (lastCaption.isNotBlank() && System.currentTimeMillis() - lastTime <= 30000L) lastCaption else null
          }

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 64, 48, 64)
                      setBackgroundColor(Color.parseColor("#0F172A"))
                  }
                  root.addView(TextView(this).apply {
                      text = "Graph Messenger ⇄ WhatsApp Bridge"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 20f)
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, 32)
                  })
                  root.addView(Button(this).apply {
                      text = "1. Grant Floating Overlay Permission"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this@MainActivity)) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          } else {
                              Toast.makeText(context, "Overlay permission already granted!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "2. Enable Accessibility Caption Helper"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  root.addView(Button(this).apply {
                      text = "3. Start Floating Share Button"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(context, "Grant Overlay Permission first", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }
                          val s = Intent(this@MainActivity, FloatingShareService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(s) else startService(s)
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Stop Floating Share Button"
                      setOnClickListener { stopService(Intent(this@MainActivity, FloatingShareService::class.java)) }
                  })
                  setContentView(root)
              }
          }

          class FloatingShareService : Service() {
              private lateinit var wm: WindowManager
              private var bubble: TextView? = null
              private val handler = Handler(Looper.getMainLooper())
              companion object { var instance: FloatingShareService? = null }

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  val chId = "telewa_bridge"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(NotificationChannel(chId, "Floating Share", NotificationManager.IMPORTANCE_LOW))
                  }
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val notif = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, chId).setContentTitle("TG ⇄ WA Floating Share").setSmallIcon(android.R.drawable.ic_menu_share).setContentIntent(pi).build()
                  } else {
                      @Suppress("DEPRECATION") Notification.Builder(this).setContentTitle("TG ⇄ WA Floating Share").setSmallIcon(android.R.drawable.ic_menu_share).setContentIntent(pi).build()
                  }
                  startForeground(1001, notif)
                  setupBubble()
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupBubble() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val tv = TextView(this).apply {
                      text = "TG ➔ WA"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(28, 20, 28, 20)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = 64f
                          setColor(Color.parseColor("#10B981"))
                          setStroke(3, Color.WHITE)
                      }
                  }
                  val flag = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                  val lp = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, flag, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 24; y = 420
                  }
                  var ix = 0; var iy = 0; var tx = 0f; var ty = 0f; var downTime = 0L
                  tv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { ix = lp.x; iy = lp.y; tx = e.rawX; ty = e.rawY; downTime = System.currentTimeMillis(); true }
                          MotionEvent.ACTION_MOVE -> { lp.x = ix + (e.rawX - tx).toInt(); lp.y = iy + (e.rawY - ty).toInt(); wm.updateViewLayout(tv, lp); true }
                          MotionEvent.ACTION_UP -> {
                              if (abs(e.rawX - tx) < 18 && abs(e.rawY - ty) < 18) {
                                  if (System.currentTimeMillis() - downTime >= 600L) toggleMode() else onBubbleTap()
                              }
                              true
                          }
                          else -> false
                      }
                  }
                  bubble = tv
                  wm.addView(tv, lp)
                  refreshAppearance()
              }

              fun refreshAppearance() {
                  handler.post {
                      val b = bubble ?: return@post
                      val isTg = BridgeState.activePkg == BridgeState.PKG_GRAPH
                      b.text = if (isTg) "TG ➔ WA" else "WA ➔ TG"
                      (b.background as? GradientDrawable)?.setColor(Color.parseColor(if (isTg) "#10B981" else "#0284C7"))
                  }
              }

              private fun toggleMode() {
                  BridgeState.activePkg = if (BridgeState.activePkg == BridgeState.PKG_GRAPH) BridgeState.PKG_WA else BridgeState.PKG_GRAPH
                  refreshAppearance()
              }

              private fun onBubbleTap() {
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = cm.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString()
                  if (!clip.isNullOrBlank() && BridgeState.getFreshCaption() == null) BridgeState.recordCaption(clip)
                  if (PostBridgeAccessibilityService.instance?.captureAndClickShare() == true) {
                      Toast.makeText(this, "Caption saved — select TG-WA Bridge in Share menu", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val cap = BridgeState.getFreshCaption() ?: clip
                  if (!cap.isNullOrBlank()) {
                      val target = if (BridgeState.activePkg == BridgeState.PKG_GRAPH) BridgeState.PKG_WA else BridgeState.PKG_GRAPH
                      startActivity(Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"; putExtra(Intent.EXTRA_TEXT, cap); setPackage(target); addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      })
                  } else {
                      Toast.makeText(this, "Select a post first, then tap Floating Button or Share -> TG-WA Bridge", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onDestroy() { super.onDestroy(); instance = null; bubble?.let { wm.removeView(it) } }
              override fun onBind(intent: Intent?): IBinder? = null
          }

          class PostBridgeAccessibilityService : AccessibilityService() {
              companion object { var instance: PostBridgeAccessibilityService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); instance = this }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return
                  if (pkg == BridgeState.PKG_GRAPH || pkg == BridgeState.PKG_WA) {
                      if (BridgeState.activePkg != pkg) { BridgeState.activePkg = pkg; FloatingShareService.instance?.refreshAppearance() }
                      rootInActiveWindow?.let { root -> extractCaption(root, pkg)?.let { BridgeState.recordCaption(it) } }
                  }
              }

              fun captureAndClickShare(): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val pkg = root.packageName?.toString() ?: BridgeState.activePkg
                  extractCaption(root, pkg)?.let {
                      BridgeState.recordCaption(it)
                      (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("caption", it))
                  }
                  val matches = root.findAccessibilityNodeInfosByText("Share")
                  for (n in matches) {
                      if (n.isClickable) return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      if (n.parent?.isClickable == true) return n.parent.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                  }
                  return false
              }

              private fun extractCaption(root: AccessibilityNodeInfo, pkg: String): String? {
                  val list = mutableListOf<String>()
                  val ignore = setOf("Share", "Forward", "Reply", "Copy", "Delete", "Message", "Search")
                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null) return
                      val t = n.text?.toString()?.trim()
                      val d = n.contentDescription?.toString()?.trim()
                      if (!t.isNullOrBlank() && t.length > 3 && t !in ignore) list.add(t)
                      else if (pkg == BridgeState.PKG_GRAPH && !d.isNullOrBlank() && d.length > 5) list.add(d)
                      for (i in 0 until n.childCount) walk(n.getChild(i))
                  }
                  walk(root)
                  return list.maxByOrNull { it.length }
              }
              override fun onInterrupt() {}
              override fun onDestroy() { super.onDestroy(); instance = null }
          }

          class ShareBridgeActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  processShare(intent)
                  finish()
              }

              private fun processShare(incoming: Intent?) {
                  if (incoming == null) return
                  val ref = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP_MR1) referrer?.host else null
                  val src = if (ref == BridgeState.PKG_GRAPH || ref == BridgeState.PKG_WA) ref else BridgeState.activePkg
                  val target = if (src == BridgeState.PKG_GRAPH) BridgeState.PKG_WA else BridgeState.PKG_GRAPH
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = cm.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString()
                  val caption = incoming.getStringExtra(Intent.EXTRA_TEXT)?.takeIf { it.isNotBlank() }
                      ?: BridgeState.getFreshCaption() ?: clip.orEmpty()
                  val mime = incoming.type ?: "*/*"

                  if (incoming.action == Intent.ACTION_SEND) {
                      @Suppress("DEPRECATION") val u = incoming.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)
                      val outUri = u?.let { copyToCache(it, mime) ?: it }
                      startActivity(Intent(Intent.ACTION_SEND).apply {
                          type = mime; setPackage(target)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          if (caption.isNotBlank()) putExtra(Intent.EXTRA_TEXT, caption)
                          if (outUri != null) {
                              putExtra(Intent.EXTRA_STREAM, outUri)
                              clipData = ClipData.newUri(contentResolver, "shared", outUri)
                              grantUriPermission(target, outUri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }
                      })
                  }
              }

              private fun copyToCache(uri: Uri, mime: String): Uri? = try {
                  val dir = File(cacheDir, "shared_posts").apply { mkdirs() }
                  val ext = if (mime.contains("video")) ".mp4" else ".jpg"
                  val f = File(dir, "post_${System.currentTimeMillis()}$ext")
                  contentResolver.openInputStream(uri)?.use { i -> FileOutputStream(f).use { o -> i.copyTo(o) } }
                  FileProvider.getUriForFile(this, "com.bridge.telewa.fileprovider", f)
              } catch (e: Exception) { null }
          }
          KOTLIN_EOF
          fi

      - name: Build Signed Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TG-WA-Floating-Bridge.apk

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-WA-Floating-Bridge-APK
          path: TG-WA-Floating-Bridge.apk
