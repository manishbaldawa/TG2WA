Create a GitHub repository: Open GitHub in your browser, create a new repository (public or private), and tap Add file ➔ Create new file.

Add the workflow file: Type .github/workflows/build-apk.yml in the file name box, paste the contents of build-apk.yml (or upload it to .github/workflows/), and tap Commit changes (if you also upload your customized TeleWaFloatingBridge.kt to the repository root, the workflow will automatically use it).

Run the cloud build: Open the Actions tab in your repository, select Build TG-WA Floating Share APK, and tap Run workflow (it also triggers automatically on every push to main).

Download and install the APK: Wait about 2 minutes for the green checkmark, open the completed workflow run, scroll down to Artifacts, and download TG-WA-Floating-Bridge-APK (unzip it on your phone to install TG-WA-Floating-Bridge.apk).

what is this in inbox

Those two alerts in your GitHub Notifications inbox show that GitHub Actions tried to run .github/workflows/build-apk.yml twice (#1 and #2) on the main branch of your manishbaldawa/TG2WA repository, and both runs failed before completing the APK build.

YML icon
build-apk
 YML 
Why the notification shows .github/workflows/build-apk.yml instead of the workflow name: When GitHub lists the raw file path as the title, it means GitHub's workflow parser rejected the file before starting the job — either because the single 40 KB run: block in the previous file exceeded GitHub Actions' 21,000-character per-step limit, or because YAML indentation shifted when pasting the text into GitHub's web editor.

What I've fixed in the updated build-apk.yml above: I've split the project scaffolding and Kotlin source generation into separate, compact steps (well below GitHub's character limit), replaced the ${applicationId} variable with the literal com.bridge.telewa.fileprovider authority, and removed the permissions: contents: write block that can fail on default read-only repository tokens.

How to re-run the build: Open .github/workflows/build-apk.yml in your manishbaldawa/TG2WA repository, click the pencil (Edit) icon, replace its contents with the updated build-apk.yml above (or upload the file directly via Add file ➔ Upload files inside .github/workflows/ so mobile browsers don't alter spaces), and commit the change to trigger a fresh build.

If a run still shows a red X, click directly on the failed run in your repository's Actions tab and share a screenshot of the error message so I can pinpoint the exact line.





