Option 1: Using the Ready-to-Run Script (No Compiling Required)
If you want a floating button on your phone immediately without building an APK in Android Studio, use tg_wa_floating_share.sh with Termux, Termux:API, and Termux:Float:

Grant storage access: Run termux-setup-storage and pkg install termux-api inside Termux.

Install the floating and share hooks: Save tg_wa_floating_share.sh to Termux and run bash tg_wa_floating_share.sh --install.

Use the floating window: Open Termux:Float to keep the compact floating window on screen over Graph Messenger and WhatsApp; copy a post's caption, save/download the media (or share the post directly to Termux from the Android Share menu), and tap 1 (Graph Messenger ➔ WhatsApp) or 2 (WhatsApp ➔ Graph Messenger).

Option 2: Building the Native Android App (TeleWaFloatingBridge.kt)
If you want a standalone native APK with a draggable pill button (TG ➔ WA / WA ➔ TG):

Add the source files: Create an Empty Activity project in Android Studio with package name com.bridge.telewa, place TeleWaFloatingBridge.kt in app/src/main/java/com/bridge/telewa/, and replace app/src/main/AndroidManifest.xml.

Add the two XML resource files: Copy the accessibility_service_config.xml and file_paths.xml blocks from the bottom comment of AndroidManifest.xml into app/src/main/res/xml/.

Enable permissions on first launch: Open the compiled app, tap Grant Floating Button Overlay Permission and Enable Caption & Share Accessibility Service, and then tap Start Floating Share Button.

Share posts with captions: Select any post in Graph Messenger (ir.ilmili.telegraph) or WhatsApp (com.whatsapp) and tap the floating button (or choose TG ⇄ WA Bridge (With Caption) from the native Share sheet); long-pressing the floating button manually flips the target direction.

