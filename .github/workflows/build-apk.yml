name: Build TG-WA Floating Share APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack and Build APK
        run: echo "" | base64 -d > proj.zip && unzip -oq proj.zip && gradle assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk TG-WA-Floating-Bridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TG-WA-Floating-Bridge-APK
          path: TG-WA-Floating-Bridge.apk
