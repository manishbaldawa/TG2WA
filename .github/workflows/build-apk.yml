Create a GitHub repository: Open GitHub in your browser, create a new repository (public or private), and tap Add file ➔ Create new file.

Add the workflow file: Type .github/workflows/build-apk.yml in the file name box, paste the contents of build-apk.yml (or upload it to .github/workflows/), and tap Commit changes (if you also upload your customized TeleWaFloatingBridge.kt to the repository root, the workflow will automatically use it).

Run the cloud build: Open the Actions tab in your repository, select Build TG-WA Floating Share APK, and tap Run workflow (it also triggers automatically on every push to main).

Download and install the APK: Wait about 2 minutes for the green checkmark, open the completed workflow run, scroll down to Artifacts, and download TG-WA-Floating-Bridge-APK (unzip it on your phone to install TG-WA-Floating-Bridge.apk).





